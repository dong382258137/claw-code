[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "2026.8.30"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"
# DAG 多 agent 编排基础设施 (v0.2):petgraph 提供图算法(SCC 环检测、toposort),
# tokio-util 提供 CancellationToken 用于 FailFast 取消,serde_yaml 用于 DAG 定义文件解析,
# async-trait 用于 SubagentExecutor trait 的 async fn, thiserror 用于 NodeError/DagError。
petgraph = "0.6"
tokio-util = { version = "0.7", features = ["rt"] }
serde_yaml = "0.9"
async-trait = "0.1"
thiserror = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# 本地 fork 的 agent-client-protocol 0.10.4,修补 silent drop 行为:
# - 解析失败时返回 -32700 parse_error(原 silent drop)
# - 无 id 无 method 时返回 -32600 invalid_request(原 silent drop)
# 详见 rust/forks/agent-client-protocol/src/rpc.rs
[patch.crates-io]
agent-client-protocol = { path = "forks/agent-client-protocol" }
