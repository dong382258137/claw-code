[package]
name = "web-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DeepSeek web page bridge: turns the logged-in web chat into the model backend for the claw engine"

[dependencies]
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
claw-acp = { path = "../claw-acp" }
claw-shell = { path = "../claw-shell" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tools = { path = "../tools" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmi = { version = "0.31", default-features = false }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }

[[bin]]
name = "claw-web-bridge"
path = "src/main.rs"

[lints]
workspace = true