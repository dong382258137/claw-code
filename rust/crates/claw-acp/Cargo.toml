[package]
name = "claw-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ACP (Agent Communication Protocol) channel/gateway layer for claw-code"

[features]
default = ["acp-0_10"]
acp-0_10 = ["dep:agent-client-protocol"]

[dependencies]
# 0.10.4 schema(feature 控制)
agent-client-protocol = { version = "0.10.4", features = ["unstable"], optional = true }
async-trait = "0.1"
derive_more = "0.99"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
