[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
glob = "0.3"
getrandom = "0.2"
plugins = { path = "../plugins" }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "time", "sync"] }
walkdir = "2"
# DAG 多 agent 编排基础设施 (v0.2):见 workspace Cargo.toml 注释。
petgraph.workspace = true
tokio-util.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Step 4.2: LSP 官方类型定义,用于类型安全的 documentSymbol/Diagnostic 解析。
# 替代部分手搓 serde_json,提高协议层可靠性。
lsp-types = "0.95"
# Step 2.4: 本地嵌入模型（BGE-small-en-v1.5,384 维）。
# 默认关闭 — 启用后增加 ~50MB 二进制 + 首次运行下载模型。
# SemanticRecaller 在 feature 关闭时退化到 keyword fallback。
fastembed = { version = "5", optional = true }

# bash 智能超时检测器：Windows 上用 GetProcessTimes + CreateToolhelp32Snapshot
# 查询子进程树 CPU 时间，区分"长计算无输出"和"死锁挂起"。
# 仅作 Windows target 依赖（其他平台用 /proc），不影响非 Windows 编译。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"

[features]
# Step 2.4: 启用本地 embedding 模型支持（fastembed + ONNX Runtime）。
# 默认关闭以保持轻量构建。启用命令:`cargo build --features runtime/embedding`。
embedding = ["dep:fastembed"]

[lints]
workspace = true
