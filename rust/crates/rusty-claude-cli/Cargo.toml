[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "claw-plus"
path = "src/main.rs"

[[bin]]
name = "claw-plus-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "claw"
path = "src/bin/claw.rs"

[dependencies]
api = { path = "../api" }
ansi-to-tui = { version = "7", optional = true }
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# claw-shell 默认 feature 是 acp-0_10;这里 default-features = false 让
# rusty-claude-cli 显式控制 ACP 版本。默认启用 acp-0_10(见 [features])。
claw-shell = { path = "../claw-shell", default-features = false }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Myers diff 算法,供 tui-ports/diff_view.rs 使用(从 grok-build 移植)
similar = "2"
syntect = "5"
sys-locale = "0.3"
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
tools = { path = "../tools" }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
# stderr_guard.rs 需要 Win32 FFI（CreatePipe / SetStdHandle / ReadFile）
# 来在 TUI 模式下重定向 stderr。这是经过审查的边界防护代码，
# 安全不变量已在 Drop 中保证。
unsafe_code = "allow"

[lints.clippy]
# 从 workspace 继承的 clippy 规则（workspace=true 与手动 lint
# 覆盖不兼容，故在此显式列出）
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
mock-deepseek-service = { path = "../mock-deepseek-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
[features]
# 默认启用 full-tui + embedding + ACP 0.10.4(claw-shell 的 acp-0_10)。
default = ["full-tui", "embedding", "acp-0_10"]
full-tui = ["dep:ratatui", "dep:ansi-to-tui"]
embedding = ["runtime/embedding"]
# ACP 协议版本选择:默认 acp-0_10(0.10.4),可选 acp-1_5(1.3)。
# 两者互斥(claw-acp 内部 use 别名冲突),启用 acp-1_5 时必须:
#   cargo build --no-default-features --features acp-1_5
# acp-1_5 隐式携带 full-tui + embedding:因为 rusty-claude-cli 的 lib
# 在无 full-tui 时编译失败(tui_ports 引用未全部 cfg-gate),而 headless
# binary 依赖 lib 整体。这样单条命令即可产出完整 1.3 二进制。
acp-0_10 = ["claw-shell/acp-0_10"]
acp-1_5 = ["claw-shell/acp-1_5", "full-tui", "embedding"]
