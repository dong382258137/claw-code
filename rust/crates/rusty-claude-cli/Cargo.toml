[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "claw-plus"
path = "src/main.rs"

[[bin]]
name = "claw-plus-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "claw"
path = "src/bin/claw.rs"

[dependencies]
api = { path = "../api" }
ansi-to-tui = { version = "7", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
claw-shell = { path = "../claw-shell" }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Myers diff 算法,供 tui-ports/diff_view.rs 使用(从 grok-build 移植)
similar = "2"
syntect = "5"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
tools = { path = "../tools" }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
# stderr_guard.rs 需要 Win32 FFI（CreatePipe / SetStdHandle / ReadFile）
# 来在 TUI 模式下重定向 stderr。这是经过审查的边界防护代码，
# 安全不变量已在 Drop 中保证。
unsafe_code = "allow"

[lints.clippy]
# 从 workspace 继承的 clippy 规则（workspace=true 与手动 lint
# 覆盖不兼容，故在此显式列出）
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
[features]
default = ["full-tui", "embedding"]
full-tui = ["dep:ratatui", "dep:ansi-to-tui"]
embedding = ["runtime/embedding"]
