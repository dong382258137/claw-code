[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "claw-plus"
path = "src/main.rs"

[[bin]]
name = "claw"
path = "src/bin/claw.rs"

[dependencies]
api = { path = "../api" }
ansi-to-tui = { version = "7", optional = true }
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
commands = { path = "../commands" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# 轮次检查点：文件内容寻址（blob 名 = sha256），与 runtime/commands 共用同一版本。
sha2 = "0.10"
# 流式错误格式化需要展开 reqwest::Error 的 source 链。配置与 api 对齐
# （default-features=false + rustls-tls），确保与 api::ApiError::Http
# 持有同一个 reqwest 实例。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Myers diff 算法,供 tui-ports/diff_view.rs 使用(从 grok-build 移植)
similar = "2"
syntect = "5"
sys-locale = "0.3"
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
# B1 本地只读 Web 视图：axum 与 futures-util 已在 workspace lock 中（im-bridge 在用）。
# ws feature 供 P3 终端面板使用。
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# P3 终端面板：跨平台 PTY（Windows 走 ConPTY）。
portable-pty = "0.8"
tools = { path = "../tools" }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
# DeepSeek 网页后端(登录态、零 Token):`claw --model deepseek-web "任务"`。
web-bridge = { path = "../web-bridge" }

[lints.rust]
# stderr_guard.rs 需要 Win32 FFI（CreatePipe / SetStdHandle / ReadFile）
# 来在 TUI 模式下重定向 stderr。这是经过审查的边界防护代码，
# 安全不变量已在 Drop 中保证。
unsafe_code = "allow"

[lints.clippy]
# 从 workspace 继承的 clippy 规则（workspace=true 与手动 lint
# 覆盖不兼容，故在此显式列出）
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
mock-deepseek-service = { path = "../mock-deepseek-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# 默认启用 full-tui + embedding。
default = ["full-tui", "embedding"]
full-tui = ["dep:ratatui", "dep:ansi-to-tui"]
embedding = ["runtime/embedding"]
