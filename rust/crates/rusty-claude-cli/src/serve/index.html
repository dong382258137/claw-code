<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claw · 控制台</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #0d1014; --panel: #12161c; --panel-2: #171c24; --border: #232a35;
    --fg: #d8dee8; --dim: #8792a3; --faint: #5d6878;
    --accent: #5b8cff; --user: #7dd3a0; --assistant: #8ab4f8; --tool: #d3a63a;
    --system: #a78bfa; --error: #ef6b6b; --ok: #58c08a;
  }
  [data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef1f5; --border: #d8dee7;
    --fg: #1e242e; --dim: #5c6675; --faint: #8b95a4;
    --accent: #2f6fed; --user: #1f8a5b; --assistant: #235fbf; --tool: #9a6b00;
    --system: #6d4fd1; --error: #c0392b; --ok: #1f8a5b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .app { display: grid; grid-template-columns: 280px 1fr 4px auto; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .brand b { letter-spacing: .12em; font-size: 12px; }
  .brand .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-left: 8px; vertical-align: middle; }
  .brand .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .search { padding: 7px 9px; border-bottom: 1px solid var(--border); }
  .search input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .list { overflow-y: auto; flex: 1; }
  .group { padding: 7px 12px 3px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item { padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 2px solid transparent; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-left-color: var(--accent); }
  .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { color: var(--faint); font-size: 11px; display: flex; gap: 8px; }
  main { display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; color: var(--dim); font-size: 11px; margin-left: auto; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; background: var(--panel-2); white-space: nowrap; }
  .banner { display: none; padding: 6px 14px; background: color-mix(in srgb, var(--error) 16%, var(--bg)); color: var(--error); font-size: 12px; }
  .banner.show { display: block; }
  .messages { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
  .msg { margin: 0 0 14px; }
  .msg .head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .msg .head .who { font-weight: 700; }
  .msg.user .who { color: var(--user); } .msg.assistant .who { color: var(--assistant); }
  .msg.tool .who { color: var(--tool); } .msg.system .who { color: var(--system); }
  .msg .body { border-left: 2px solid var(--border); padding-left: 12px; }
  .msg.user .body { border-left-color: color-mix(in srgb, var(--user) 55%, transparent); }
  .msg.assistant .body { border-left-color: color-mix(in srgb, var(--assistant) 45%, transparent); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .text h1, .text h2, .text h3 { margin: 12px 0 6px; line-height: 1.3; white-space: normal; }
  .text h1 { font-size: 18px; } .text h2 { font-size: 16px; } .text h3 { font-size: 15px; }
  .text code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .text pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre; }
  .text pre code { border: 0; background: none; padding: 0; }
  .text a { color: var(--accent); }
  .text ul { margin: 6px 0; padding-left: 20px; }
  details { margin: 6px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
  details > summary { cursor: pointer; padding: 4px 10px; color: var(--dim); font-size: 12px; user-select: none; }
  details[open] > summary { border-bottom: 1px solid var(--border); }
  details pre { margin: 0; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; }
  details.thinking { border-left: 2px solid var(--system); }
  details.tool { border-left: 2px solid var(--tool); }
  details.tool.error { border-left-color: var(--error); }
  .tool .name { color: var(--tool); }
  .tool.error .name { color: var(--error); }
  .empty { color: var(--dim); padding: 30px 18px; text-align: center; }
  .jump { position: absolute; right: 18px; bottom: 104px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .jump.show { display: block; }
  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  #composer textarea { resize: none; min-height: 40px; max-height: 180px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; overflow-y: auto; }
  #composer textarea:focus { border-color: var(--accent); }
  .controls { display: flex; flex-direction: column; gap: 5px; }
  .controls select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 5px; font-size: 12px; }
  .hint { grid-column: 1 / -1; color: var(--faint); font-size: 11px; display: flex; justify-content: space-between; }
  /* splitter + right panel */
  #splitter { cursor: col-resize; background: transparent; }
  #splitter:hover { background: var(--accent); }
  #panel { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 240px; width: 380px; }
  #panel.collapsed { display: none; }
  .panel-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .tabbtn { background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 2px 8px; color: var(--dim); }
  .tabbtn.active { color: var(--fg); background: var(--panel-2); border-color: var(--border); }
  .panel-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .tabpane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tabpane.active { display: flex; }
  .pane-toolbar { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); align-items: center; }
  .pane-toolbar input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; outline: none; }
  .pane-scroll { overflow: auto; flex: 1; padding: 6px 8px; }
  .fitem { padding: 2px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .fitem:hover { background: var(--panel-2); color: var(--fg); }
  .fitem .sz { color: var(--faint); font-size: 10px; margin-left: 6px; }
  .diff-file { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .diff-file:hover { background: var(--panel-2); }
  .diff-file .add { color: var(--ok); } .diff-file .del { color: var(--error); }
  .patch { margin: 0; white-space: pre-wrap; font-size: 12px; }
  .patch .l-add { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); display: block; }
  .patch .l-del { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); display: block; }
  .patch .l-hunk { color: var(--accent); display: block; }
  .patch .l-meta { color: var(--faint); display: block; }
  #preview { flex: 1; overflow: auto; padding: 8px 10px; }
  #preview img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; }
  #preview iframe { width: 100%; height: 100%; border: 0; }
  #preview pre { margin: 0; white-space: pre-wrap; font-size: 12px; }
  .todo { display: flex; gap: 8px; padding: 4px 2px; border-bottom: 1px dashed var(--border); }
  .todo .st { width: 18px; }
  .todo.done .txt { color: var(--faint); text-decoration: line-through; }
  .goal { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2); }
  .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .settings-row select, .settings-row input { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  @media (max-width: 1100px) { #panel { display: none; } #splitter { display: none; } }
  @media (max-width: 840px) {
    .app { grid-template-columns: 1fr; }
    aside { position: absolute; z-index: 5; width: 84vw; height: 100%; transform: translateX(-100%); transition: transform .18s ease; }
    aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
    .menu-btn { display: inline-block !important; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <span><b>CLAW</b><span id="runDot" class="dot" title="运行状态"></span></span>
      <button id="theme" title="切换主题" type="button">◐</button>
    </div>
    <div class="search"><input id="q" placeholder="搜索会话 / Ctrl+K" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" id="menu" type="button">☰</button>
      <span class="title" id="title">未选择会话</span>
      <div class="chips" id="chips"></div>
      <button id="togglePanel" type="button" title="显示/隐藏右侧面板">面板</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="messages" id="messages">
      <div class="empty">从左侧选择一个会话；底部可直接发消息。</div>
    </div>
    <button class="jump" id="jump" type="button">跳到最新 ↓</button>
    <form id="composer">
      <textarea id="prompt" rows="2" placeholder="输入消息；Ctrl+Enter 发送（需 DEEPSEEK_API_KEY）"></textarea>
      <div class="controls">
        <select id="permission" title="本轮权限模式">
          <option value="workspace-write">workspace-write</option>
          <option value="read-only">read-only</option>
          <option value="danger-full-access">danger-full-access</option>
        </select>
        <button id="send" type="submit">发送</button>
        <button id="stop" type="button">停止</button>
      </div>
      <div class="hint"><span>Ctrl+K 搜索 · Ctrl+Enter 发送</span><span id="meta"></span></div>
    </form>
  </main>

  <div id="splitter" title="拖动调整面板宽度"></div>

  <section id="panel">
    <div class="panel-head">
      <button class="tabbtn active" data-tab="files">文件</button>
      <button class="tabbtn" data-tab="diff">Diff</button>
      <button class="tabbtn" data-tab="tasks">任务</button>
      <button class="tabbtn" data-tab="settings">设置</button>
      <button class="tabbtn" data-tab="preview">预览</button>
      <span style="flex:1"></span>
      <button id="panelClose" title="收起面板" type="button">×</button>
    </div>
    <div class="panel-body">
      <div class="tabpane active" id="tab-files">
        <div class="pane-toolbar"><input id="fileFilter" placeholder="过滤文件…"><button id="filesRefresh" type="button">刷新</button></div>
        <div class="pane-scroll" id="fileTree"></div>
      </div>
      <div class="tabpane" id="tab-diff">
        <div class="pane-toolbar"><button id="diffRefresh" type="button">刷新</button><span class="faint" id="diffHint"></span></div>
        <div class="pane-scroll" id="diffBody"></div>
      </div>
      <div class="tabpane" id="tab-tasks">
        <div class="pane-toolbar"><button id="tasksRefresh" type="button">刷新</button></div>
        <div class="pane-scroll" id="tasksBody"><div class="empty">先选择会话</div></div>
      </div>
      <div class="tabpane" id="tab-settings">
        <div class="pane-scroll" id="settingsBody">
          <div class="settings-row"><span>主题</span>
            <select id="setTheme"><option value="dark">dark</option><option value="light">light</option></select>
          </div>
          <div class="settings-row"><span>默认权限</span>
            <select id="setPermission">
              <option value="workspace-write">workspace-write</option>
              <option value="read-only">read-only</option>
              <option value="danger-full-access">danger-full-access</option>
            </select>
          </div>
          <div class="settings-row"><span>面板宽度</span><input id="setWidth" type="number" min="260" max="720" step="10" style="width:90px"></div>
          <div class="pane-toolbar" style="border:0;padding:10px 0"><button id="saveSettings" type="button">保存</button><span id="settingsHint" class="faint"></span></div>
        </div>
      </div>
      <div class="tabpane" id="tab-preview">
        <div class="pane-toolbar"><span id="previewPath" class="faint">未选择文件</span><span style="flex:1"></span><button id="previewBack" type="button">文件</button></div>
        <div id="preview"><div class="empty">在“文件”里点击一个文件</div></div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';
  const token = new URLSearchParams(location.search).get('t') || '';
  const withToken = (path) => path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);
  const $ = (id) => document.getElementById(id);
  const state = {
    sessions: [], currentId: null, source: null, running: false, atBottom: true,
    filter: '', files: [], fileFilter: '', diff: null, tab: 'files',
  };

  const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[ch]);

  function fmtTime(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function relTime(sec) {
    if (!sec) return '';
    const diff = Math.max(0, Date.now() / 1000 - sec);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }
  function renderMarkdown(raw) {
    const parts = String(raw).split(/```/);
    return parts.map((part, index) => {
      if (index % 2 === 1) {
        const body = part.replace(/^([a-zA-Z0-9_+-]*)\n/, '');
        return `<pre><code>${escapeHtml(body)}</code></pre>`;
      }
      return part.split('\n').map((line) => {
        let text = escapeHtml(line);
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        text = text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        if (/^###\s+/.test(line)) return `<h3>${text.replace(/^###\s+/, '')}</h3>`;
        if (/^##\s+/.test(line)) return `<h2>${text.replace(/^##\s+/, '')}</h2>`;
        if (/^#\s+/.test(line)) return `<h1>${text.replace(/^#\s+/, '')}</h1>`;
        if (/^\s*[-*]\s+/.test(line)) return `<ul><li>${text.replace(/^\s*[-*]\s+/, '')}</li></ul>`;
        return text;
      }).join('\n').replace(/<\/ul>\n<ul>/g, '');
    }).join('');
  }

  /* ---------- 会话 ---------- */
  function renderList() {
    const q = state.filter.trim().toLowerCase();
    const sessions = state.sessions.filter((s) =>
      !q || (s.title || '').toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || (s.workspace || '').toLowerCase().includes(q));
    const list = $('list');
    if (!sessions.length) { list.innerHTML = '<div class="empty">没有匹配的会话</div>'; return; }
    const groups = new Map();
    for (const s of sessions) {
      const key = (s.workspace || '').split(/[\\/]/).filter(Boolean).pop() || '未知工作区';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    const html = [];
    for (const [workspace, items] of groups) {
      html.push(`<div class="group" title="${escapeHtml(items[0].workspace || '')}">${escapeHtml(workspace)} · ${items.length}</div>`);
      for (const s of items) {
        const active = s.id === state.currentId ? ' active' : '';
        const size = s.size ? Math.max(1, Math.round(s.size / 1024)) + ' KB' : '';
        html.push(`<div class="item${active}" data-id="${escapeHtml(s.id)}" title="${escapeHtml(s.workspace || '')}">
          <div class="t">${escapeHtml(s.title || s.id)}</div><div class="m"><span>${relTime(s.modified)}</span><span>${size}</span></div></div>`);
      }
    }
    list.innerHTML = html.join('');
    list.querySelectorAll('.item').forEach((node) => {
      node.addEventListener('click', () => { openSession(node.dataset.id); $('sidebar').classList.remove('open'); });
    });
  }

  function blockHtml(block) {
    if (block.kind === 'thinking') return `<details class="thinking"><summary>思考过程</summary><pre>${escapeHtml(block.text || '')}</pre></details>`;
    if (block.kind === 'tool_use') {
      const input = block.input || '';
      return `<details class="tool"${input.length <= 240 ? ' open' : ''}><summary><span class="name">▶ ${escapeHtml(block.name)}</span></summary><pre>${escapeHtml(input)}</pre></details>`;
    }
    if (block.kind === 'tool_result') {
      const output = block.output || '';
      return `<details class="tool${block.is_error ? ' error' : ''}"${output.length <= 600 ? ' open' : ''}><summary><span class="name">${block.is_error ? '✗' : '✓'} ${escapeHtml(block.name)}</span></summary><pre>${escapeHtml(output)}</pre></details>`;
    }
    return `<div class="text">${renderMarkdown(block.text || '')}</div>`;
  }

  function renderView(view) {
    const box = $('messages');
    const stick = state.atBottom;
    const items = (view.messages || []).filter((m) => (m.blocks || []).length);
    box.innerHTML = items.length
      ? items.map((m) => `<div class="msg ${escapeHtml(m.role)}"><div class="head"><span class="who">${escapeHtml(m.role)}</span></div><div class="body">${(m.blocks || []).map(blockHtml).join('')}</div></div>`).join('')
      : '<div class="empty">该会话还没有消息。</div>';
    $('title').textContent = view.id || '';
    const chips = [];
    if (view.model) chips.push(`<span class="chip">${escapeHtml(view.model)}</span>`);
    if (view.workspace) chips.push(`<span class="chip" title="${escapeHtml(view.workspace)}">${escapeHtml(view.workspace.split(/[\\/]/).filter(Boolean).pop())}</span>`);
    chips.push(`<span class="chip">${view.message_count} 条</span>`);
    if (view.created_at_ms) chips.push(`<span class="chip">${fmtTime(view.created_at_ms)}</span>`);
    $('chips').innerHTML = chips.join('');
    $('meta').textContent = `${view.message_count} 条消息`;
    if (stick) box.scrollTop = box.scrollHeight;
    updateJump();
  }

  function updateJump() {
    const box = $('messages');
    state.atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    $('jump').classList.toggle('show', !state.atBottom);
  }
  function setRunning(running) {
    state.running = running;
    $('runDot').classList.toggle('on', running);
    $('send').disabled = running;
    if (running) $('meta').textContent = '运行中…';
  }
  function showBanner(text) { const b = $('banner'); b.textContent = text; b.classList.add('show'); }
  function hideBanner() { $('banner').classList.remove('show'); }

  async function loadSessions() {
    const response = await fetch(withToken('/api/sessions'));
    if (!response.ok) { showBanner('会话列表加载失败 HTTP ' + response.status); return; }
    state.sessions = await response.json();
    renderList();
  }
  async function openSession(id) {
    state.currentId = id;
    if (state.source) { state.source.close(); state.source = null; }
    renderList();
    const response = await fetch(withToken('/api/session/' + encodeURIComponent(id)));
    if (!response.ok) { showBanner('会话读取失败 HTTP ' + response.status); return; }
    state.atBottom = true;
    renderView(await response.json());
    connectStream(id);
    pollStatus(id);
    loadTasks();
  }
  function connectStream(id) {
    const source = new EventSource(withToken('/api/session/' + encodeURIComponent(id) + '/stream'));
    source.addEventListener('snapshot', (event) => { hideBanner(); try { renderView(JSON.parse(event.data)); } catch (_) {} });
    source.onerror = () => showBanner('连接中断，正在重连…');
    source.onopen = () => hideBanner();
    state.source = source;
  }
  let pollTimer = null;
  function pollStatus(id) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      if (state.currentId !== id) return;
      try {
        const response = await fetch(withToken('/api/session/' + encodeURIComponent(id) + '/status'));
        if (!response.ok) return;
        setRunning(Boolean((await response.json()).running));
      } catch (_) {}
    }, 1500);
  }

  /* ---------- 面板 ---------- */
  function showTab(name) {
    state.tab = name;
    document.querySelectorAll('.tabbtn').forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === name));
    document.querySelectorAll('.tabpane').forEach((pane) => pane.classList.toggle('active', pane.id === 'tab-' + name));
    if (name === 'files') loadFiles();
    if (name === 'diff') loadDiff();
    if (name === 'tasks') loadTasks();
    if (name === 'settings') fillSettings();
  }
  function openPanel(tab) {
    $('panel').classList.remove('collapsed');
    if (tab) showTab(tab);
  }
  document.querySelectorAll('.tabbtn').forEach((btn) => btn.addEventListener('click', () => showTab(btn.dataset.tab)));
  $('togglePanel').addEventListener('click', () => {
    const collapsed = $('panel').classList.toggle('collapsed');
    if (!collapsed) showTab(state.tab);
  });
  $('panelClose').addEventListener('click', () => $('panel').classList.add('collapsed'));
  $('previewBack').addEventListener('click', () => showTab('files'));

  async function loadFiles() {
    const response = await fetch(withToken('/api/workspace/files'));
    if (!response.ok) { $('fileTree').innerHTML = '<div class="empty">文件列表加载失败 HTTP ' + response.status + '</div>'; return; }
    const body = await response.json();
    state.files = body.files || [];
    renderFiles();
  }
  function renderFiles() {
    const q = state.fileFilter.trim().toLowerCase();
    const files = state.files.filter((f) => !q || f.path.toLowerCase().includes(q));
    if (!files.length) { $('fileTree').innerHTML = '<div class="empty">没有匹配的文件</div>'; return; }
    $('fileTree').innerHTML = files.map((f) => {
      const depth = Math.min(6, (f.path.match(/\//g) || []).length);
      const name = f.path.split('/').pop();
      return `<div class="fitem" data-path="${escapeHtml(f.path)}" style="padding-left:${4 + depth * 12}px" title="${escapeHtml(f.path)}">${escapeHtml(name)}<span class="sz">${f.size ? Math.max(1, Math.round(f.size / 1024)) + 'K' : ''}</span></div>`;
    }).join('');
    $('fileTree').querySelectorAll('.fitem').forEach((node) => {
      node.addEventListener('click', () => openFile(node.dataset.path));
    });
  }
  $('fileFilter').addEventListener('input', (event) => { state.fileFilter = event.target.value; renderFiles(); });
  $('filesRefresh').addEventListener('click', loadFiles);

  async function openFile(path) {
    $('previewPath').textContent = path;
    showTab('preview');
    $('preview').innerHTML = '<div class="empty">加载中…</div>';
    const response = await fetch(withToken('/api/workspace/file?path=' + encodeURIComponent(path)));
    if (!response.ok) {
      $('preview').innerHTML = `<div class="empty">预览失败 HTTP ${response.status}<br>${escapeHtml(await response.text())}</div>`;
      return;
    }
    const file = await response.json();
    if (file.kind === 'image') {
      $('preview').innerHTML = `<img src="${withToken('/api/workspace/raw?path=' + encodeURIComponent(path))}" alt="${escapeHtml(path)}">`;
      return;
    }
    if (file.kind === 'pdf') {
      $('preview').innerHTML = `<iframe src="${withToken('/api/workspace/raw?path=' + encodeURIComponent(path))}"></iframe>`;
      return;
    }
    if (file.kind === 'binary') {
      $('preview').innerHTML = `<div class="empty">二进制文件（${Math.round((file.size || 0) / 1024)} KB），不提供文本预览</div>`;
      return;
    }
    const content = file.truncated ? file.content + '\n…（已截断）' : file.content;
    $('preview').innerHTML = file.kind === 'markdown'
      ? `<div class="text">${renderMarkdown(content)}</div>`
      : `<pre>${escapeHtml(content)}</pre>`;
  }

  async function loadDiff() {
    $('diffHint').textContent = '加载中…';
    const response = await fetch(withToken('/api/workspace/diff'));
    if (!response.ok) { $('diffBody').innerHTML = '<div class="empty">diff 加载失败 HTTP ' + response.status + '</div>'; return; }
    state.diff = await response.json();
    renderDiff();
  }
  function renderDiff() {
    const diff = state.diff || { files: [], patch: '', untracked: [] };
    $('diffHint').textContent = `${diff.files.length} 个已修改 / ${diff.untracked.length} 个未跟踪`;
    const list = diff.files.map((f) => `<div class="diff-file" data-path="${escapeHtml(f.path)}"><span>${escapeHtml(f.path)}</span><span><span class="add">+${f.added}</span> <span class="del">-${f.removed}</span></span></div>`).join('');
    const untracked = diff.untracked.length ? `<div class="group">未跟踪</div>` + diff.untracked.map((p) => `<div class="fitem" data-path="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('') : '';
    $('diffBody').innerHTML = `<div class="pane-scroll" style="max-height:220px">${list}${untracked}</div><pre class="patch">${colorPatch(diff.patch)}</pre>`;
    $('diffBody').querySelectorAll('[data-path]').forEach((node) => {
      node.addEventListener('click', async () => {
        const response = await fetch(withToken('/api/workspace/diff?path=' + encodeURIComponent(node.dataset.path)));
        if (response.ok) {
          const single = await response.json();
          $('diffBody').querySelector('.patch').innerHTML = colorPatch(single.patch || '（无差异或文件未跟踪）');
        }
      });
    });
  }
  function colorPatch(patch) {
    return String(patch || '').split('\n').map((line) => {
      let cls = '';
      if (line.startsWith('@@')) cls = 'l-hunk';
      else if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ')) cls = 'l-meta';
      else if (line.startsWith('+')) cls = 'l-add';
      else if (line.startsWith('-')) cls = 'l-del';
      return cls ? `<span class="${cls}">${escapeHtml(line)}</span>` : escapeHtml(line);
    }).join('\n');
  }
  $('diffRefresh').addEventListener('click', loadDiff);

  async function loadTasks() {
    if (!state.currentId) { $('tasksBody').innerHTML = '<div class="empty">先选择会话</div>'; return; }
    $('tasksBody').innerHTML = '<div class="empty">加载中…</div>';
    const [tasksResponse, goalResponse] = await Promise.all([
      fetch(withToken('/api/session/' + encodeURIComponent(state.currentId) + '/tasks')),
      fetch(withToken('/api/workspace/goal')),
    ]);
    const body = tasksResponse.ok ? await tasksResponse.json() : { todos: [], tasks: [], plan_mode: null };
    const goal = goalResponse.ok ? (await goalResponse.json()).goal : null;
    const goals = goal && goal.status ? `<div class="goal"><b>目标</b> ${escapeHtml(goal.text || goal.title || '')}<br><span class="faint">状态: ${escapeHtml(goal.status)}</span></div>` : '';
    const todos = (body.todos || []).map((todo) => {
      const done = todo.status === 'completed';
      const mark = done ? '✔' : todo.status === 'in_progress' ? '▶' : '○';
      return `<div class="todo${done ? ' done' : ''}"><span class="st">${mark}</span><span class="txt">${escapeHtml(todo.content || '')}</span></div>`;
    }).join('');
    const tasks = (body.tasks || []).map((task) => `<div class="todo"><span class="st">◆</span><span class="txt"><b>${escapeHtml(task.tool)}</b> ${escapeHtml(task.detail || '')}</span></div>`).join('');
    const plan = body.plan_mode === true ? '<span class="chip">Plan 模式</span>' : '';
    $('tasksBody').innerHTML = `${goals}<div style="margin:6px 0">${plan}</div>${todos ? '<div class="group">待办</div>' + todos : ''}${tasks ? '<div class="group">任务工具调用</div>' + tasks : ''}${!goals && !todos && !tasks ? '<div class="empty">该会话没有待办或任务记录</div>' : ''}`;
  }
  $('tasksRefresh').addEventListener('click', loadTasks);

  /* ---------- 设置 ---------- */
  let webSettings = { theme: 'dark', permission: 'workspace-write', panel_width: 380 };
  async function loadWebSettings() {
    try {
      const response = await fetch(withToken('/api/web-settings'));
      if (response.ok) webSettings = await response.json();
    } catch (_) {}
    applySettings();
  }
  function applySettings() {
    if (webSettings.theme) document.documentElement.dataset.theme = webSettings.theme;
    if (webSettings.permission) $('permission').value = webSettings.permission;
    if (webSettings.panel_width) $('panel').style.width = webSettings.panel_width + 'px';
    if (webSettings.panel_width) $('setWidth').value = webSettings.panel_width;
    $('setTheme').value = webSettings.theme || 'dark';
    $('setPermission').value = webSettings.permission || 'workspace-write';
  }
  async function saveSettings() {
    const payload = {
      theme: $('setTheme').value,
      permission: $('setPermission').value,
      panel_width: Number($('setWidth').value) || 380,
    };
    const response = await fetch(withToken('/api/web-settings'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    if (response.ok) {
      webSettings = await response.json();
      applySettings();
      $('settingsHint').textContent = '已保存';
    } else {
      $('settingsHint').textContent = '保存失败 HTTP ' + response.status;
    }
  }
  $('saveSettings').addEventListener('click', saveSettings);
  function fillSettings() {
    $('setTheme').value = document.documentElement.dataset.theme || 'dark';
    $('setPermission').value = $('permission').value;
    $('setWidth').value = parseInt($('panel').style.width || '380', 10);
  }

  /* ---------- 拖拽宽度 ---------- */
  let dragging = false;
  $('splitter').addEventListener('mousedown', (event) => {
    dragging = true;
    event.preventDefault();
    document.body.style.cursor = 'col-resize';
  });
  window.addEventListener('mousemove', (event) => {
    if (!dragging) return;
    const width = Math.max(260, Math.min(720, window.innerWidth - event.clientX));
    $('panel').style.width = width + 'px';
    $('panel').classList.remove('collapsed');
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    const width = parseInt($('panel').style.width || '380', 10);
    fetch(withToken('/api/web-settings'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ panel_width: width }),
    }).catch(() => {});
  });

  /* ---------- 发送 ---------- */
  async function sendPrompt() {
    if (!state.currentId) { showBanner('先选择一个会话'); return; }
    const text = $('prompt').value.trim();
    if (!text) return;
    const response = await fetch(withToken('/api/session/' + encodeURIComponent(state.currentId) + '/prompt'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, permission: $('permission').value }),
    });
    if (response.ok) { $('prompt').value = ''; autoGrow(); setRunning(true); $('meta').textContent = '已发送，等待模型…'; }
    else showBanner('发送失败 HTTP ' + response.status);
  }
  async function stopTurn() {
    if (!state.currentId) return;
    const response = await fetch(withToken('/api/session/' + encodeURIComponent(state.currentId) + '/interrupt'), { method: 'POST' });
    if (response.ok) { setRunning(false); $('meta').textContent = '已请求中断'; } else showBanner('当前没有运行中的 turn');
  }
  function autoGrow() {
    const node = $('prompt');
    node.style.height = 'auto';
    node.style.height = Math.min(180, node.scrollHeight) + 'px';
  }

  /* ---------- 绑定 ---------- */
  $('composer').addEventListener('submit', (event) => { event.preventDefault(); sendPrompt(); });
  $('stop').addEventListener('click', stopTurn);
  $('prompt').addEventListener('input', autoGrow);
  $('prompt').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); sendPrompt(); }
    if (event.key === 'Escape') $('prompt').blur();
  });
  $('messages').addEventListener('scroll', updateJump);
  $('jump').addEventListener('click', () => { $('messages').scrollTop = $('messages').scrollHeight; });
  $('q').addEventListener('input', (event) => { state.filter = event.target.value; renderList(); });
  $('menu').addEventListener('click', () => $('sidebar').classList.toggle('open'));
  document.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); $('q').focus(); }
  });
  $('theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    webSettings.theme = next;
    fetch(withToken('/api/web-settings'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ theme: next }) }).catch(() => {});
  });

  loadWebSettings();
  loadSessions();
})();
</script>
</body>
</html>
