[package]
name = "llm-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Model capability evaluation harness — run task suites against a DeepSeek model and score keyword/rubric matches"

[dependencies]
api = { path = "../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
